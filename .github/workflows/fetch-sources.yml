name: Fetch grant sources

# Downloads the public grant files each week so the Monday classification run
# works from complete data. Runs Sunday evening UK time; can also be run by hand.
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Coefficient Giving grants archive
        run: |
          curl -fsSL --retry 3 -A "AISF data bot (+https://github.com/${{ github.repository }})" \
            -o data/raw/coefficient-giving.csv \
            "https://coefficientgiving.org/wp-content/uploads/Coefficient-Giving-Grants-Archive.csv"

      - name: Download EA Funds grants
        run: |
          curl -fsSL --retry 3 -A "AISF data bot (+https://github.com/${{ github.repository }})" \
            -o data/raw/ea-funds.csv \
            "https://funds.effectivealtruism.org/api/grants"

      - name: Record fetch time
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > data/raw/fetched_at.txt

      - name: Commit if changed
        run: |
          git config user.name "aisf-bot"
          git config user.email "aisf-bot@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Fetch grant sources $(date -u +%F)"
          git push
