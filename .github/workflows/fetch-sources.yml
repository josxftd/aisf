name: Fetch grant sources

# Downloads the public grant files each week so the Monday classification run
# works from complete data. Runs Sunday evening UK time; can also be run by hand.
# Each source is fetched independently: one failing does not block the other.
# Results are written to data/raw/fetch_log.txt so the Monday task can see them.
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download sources
        run: |
          UA="Mozilla/5.0 (compatible; AISF data bot; +https://github.com/${{ github.repository }})"
          log=data/raw/fetch_log.txt
          echo "run $(date -u +%FT%TZ)" > "$log"
          ok=0
          fetch () {
            name="$1"; url="$2"; out="$3"
            tmp=$(mktemp)
            code=$(curl -sSL --retry 3 -A "$UA" -o "$tmp" -w '%{http_code} %{content_type}' "$url" 2>&1) || true
            size=$(wc -c < "$tmp")
            head1=$(head -c 200 "$tmp" | tr -d '\r' | head -n1)
            if [ "${code%% *}" = "200" ] && [ "$size" -gt 1000 ] && ! grep -qi '<html' <(head -c 500 "$tmp"); then
              mv "$tmp" "$out"; echo "$name OK $code bytes=$size" >> "$log"; ok=$((ok+1))
            else
              echo "$name FAILED $code bytes=$size first_line=$head1" >> "$log"
            fi
          }
          fetch coefficient-giving "https://coefficientgiving.org/wp-content/uploads/Coefficient-Giving-Grants-Archive.csv" data/raw/coefficient-giving.csv
          fetch ea-funds "https://funds.effectivealtruism.org/api/grants" data/raw/ea-funds.csv
          # SFF publishes recommendations as HTML pages, so save the home page and
          # every recommendations page it links to (the Monday task reads these files).
          mkdir -p data/raw/sff
          sffcode=$(curl -sSL --retry 3 -A "$UA" -o data/raw/sff/index.html -w '%{http_code}' "https://survivalandflourishing.fund/" 2>&1) || true
          if [ "$sffcode" = "200" ] && [ "$(wc -c < data/raw/sff/index.html)" -gt 1000 ]; then
            n=0
            for path in $(grep -oE 'href="(https://survivalandflourishing\.fund)?/[^"]*recommendations[^"]*"' data/raw/sff/index.html \
                          | sed -E 's#^href="(https://survivalandflourishing\.fund)?##; s#"$##' | sort -u); do
              slug=$(echo "$path" | sed -E 's#^/##; s#/$##; s#[^A-Za-z0-9]+#-#g')
              c=$(curl -sSL --retry 3 -A "$UA" -o "data/raw/sff/$slug.html" -w '%{http_code}' "https://survivalandflourishing.fund$path" 2>&1) || true
              [ "$c" = "200" ] && n=$((n+1)) || rm -f "data/raw/sff/$slug.html"
            done
            echo "sff OK 200 pages=$n" >> "$log"; ok=$((ok+1))
          else
            echo "sff FAILED $sffcode" >> "$log"
          fi
          # Manifund public API: backup for when the Manifund connector is unavailable.
          mcode=$(curl -sSL --retry 3 -A "$UA" -o data/raw/manifund-projects.tmp -w '%{http_code}' "https://manifund.org/api/v0/projects" 2>&1) || true
          if [ "$mcode" = "200" ] && head -c 1 data/raw/manifund-projects.tmp | grep -q '\['; then
            mv data/raw/manifund-projects.tmp data/raw/manifund-projects.json
            echo "manifund OK 200 bytes=$(wc -c < data/raw/manifund-projects.json)" >> "$log"
          else
            rm -f data/raw/manifund-projects.tmp; echo "manifund FAILED $mcode" >> "$log"
          fi
          cat "$log"
          [ "$ok" -gt 0 ] && date -u +"%Y-%m-%dT%H:%M:%SZ" > data/raw/fetched_at.txt || true
          echo "ok=$ok" >> "$GITHUB_ENV"

      # Pre-compute Coefficient Giving + EA Funds candidates here, so the Monday
      # task only reads a CSV and never has to run repository code itself.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build candidates
        run: |
          pip install --quiet pandas
          python scripts/candidates.py data/raw/coefficient-giving.csv data/raw/ea-funds.csv data/raw/candidates.csv \
            && echo "candidates OK rows=$(python -c 'import pandas as p;print(len(p.read_csv("data/raw/candidates.csv")))')" >> data/raw/fetch_log.txt \
            || echo "candidates FAILED" >> data/raw/fetch_log.txt

      # Commit through GitHub's API so the commit is signed by GitHub (shows as Verified).
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/api_commit.py "Fetch grant sources $(date -u +%F)" data/raw

      - name: Fail if nothing downloaded
        if: env.ok == '0'
        run: exit 1
